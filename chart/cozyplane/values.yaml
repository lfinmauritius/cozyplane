# Container image for all cozyplane components (agent, CNI plugin, controller).
# Digest-pinned (no floating tag); update on each published build.
image: ghcr.io/lllamnyp/cozyplane@sha256:894516653b8580c9d5fd9c2e0d6aa1e5661e867878b27dacfc3cf3331e57d2f8
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Pod MTU (underlay MTU minus Geneve overhead, ~50 bytes).
mtu: 1450

# Geneve UDP destination port. Override (e.g. 6082) only to coexist with another
# overlay still holding 6081 on the node.
genevePort: 6081

# CNI conflist filename written to /etc/cni/net.d. Lower names sort first; use a
# low prefix (e.g. "00-cozyplane.conflist") to win over a co-installed CNI such
# as Cilium (which ships 05-cilium.conflist).
cniConfName: "10-cozyplane.conflist"

# Let the agent write the standalone cozyplane conflist. Set false when the
# platform owns a chained conflist (for example cozyplane followed by Cilium).
cniConfEnabled: true

# Kube-apiserver endpoint the hostNetwork agent/responder dial. Empty = the
# in-cluster kubernetes.default ClusterIP (10.96.0.1) — correct once a service
# proxy serves it. When cozyplane is the CNI AND there is no kube-proxy, that
# ClusterIP is unserved until cozyplane-kpr (which needs the agent) is up, a
# bootstrap cycle — so point the agent at a real endpoint (Talos: KubePrism
# localhost:7445).
kubeApiServer:
  host: ""
  port: ""

# The cluster DNS domain (kubelet's clusterDomain) — the zone the split-horizon
# resolver answers authoritatively for VPC pods. Empty (the default)
# autodetects it from the resolver's own kubelet-written search path (the
# DaemonSet runs ClusterFirstWithHostNet, so the cluster domain is present
# despite hostNetwork); set explicitly only to override.
clusterDomain: ""

# Cluster networking facts for pod egress to the outside world. Not reliably
# discoverable in-cluster, so declared here.
egress:
  # The cluster pod supernet(s), comma-separated for dual-stack (e.g.
  # "10.244.0.0/16,fd00:10:244::/56"). Enables the cluster-egress masquerade
  # (pods get an off-cluster return path) and is denied to VPC tenants at
  # their gateways. Empty disables both.
  clusterCIDR: "10.244.0.0/16"
  # Masquerade implementation: "bpf" (eBPF SNAT at the uplink, no netfilter,
  # both families), "iptables" (legacy kernel rule, v4 only), or "off".
  masquerade: "bpf"
  # The Service CIDR, denied to VPC tenants at their gateways.
  serviceCIDR: "10.96.0.0/16"
  # Cluster DNS ClusterIP; the one cluster-internal door a VPC gateway opens
  # (:53 only), so tenant pods resolve with a stock resolv.conf.
  clusterDNS: "10.96.0.10"
  # Additional cluster-internal networks VPC tenants must not reach through
  # their gateways (e.g. the node/management network). Also feeds the managed-VPN
  # route-CIDR deny-set (a tenant may not tunnel one of these) — include the NODE
  # network here so the deny-set covers it.
  internalCIDRs: []

# Managed VPN (issue #6, docs/vpn.md). The controller runs tunnel appliances for
# VPNGateway/VPNConnection; these bound their placement and per-tenant scale.
# Every appliance exposes per-connection metrics on the named `vpn-metrics`
# port. When the VictoriaMetrics Operator VMPodScrape CRD is installed, this
# chart automatically registers all `app=cozyplane-vpn-gateway` pods for scrape.
# Empty/zero values use the controller's built-in defaults.
vpn:
  # Place tunnel appliances on a dedicated gateway node-pool: comma-separated
  # "key=value" node labels (nodeSelector). Empty runs them anywhere.
  gatewayNodeSelector: ""
  # Taint key the appliance tolerates (Exists/NoSchedule), to schedule onto a
  # tainted gateway pool. Empty adds no toleration.
  gatewayTolerationKey: ""
  # Per-tenant caps (0 = built-in default): gateways per namespace, peers per
  # gateway — bounds unbounded crypto workloads.
  maxGatewaysPerNamespace: 0
  maxConnectionsPerGateway: 0
  # Opt in after the kubelet admits net.ipv4.ip_forward and
  # net.ipv6.conf.all.forwarding as pod sysctls. Drops privileged mode and keeps
  # only NET_ADMIN, NET_RAW and NET_BIND_SERVICE.
  hardenedAppliance: false
  # Prometheus-compatible VPN metrics are exposed by every tunnel appliance on
  # its named vpn-metrics port. Resources below are rendered only when their
  # respective operator CRDs are installed in the cluster.
  observability:
    podScrape:
      # Keep appliance discovery on by default when VictoriaMetrics is present.
      enabled: true
      interval: 30s
    rules:
      enabled: true
      # Idle tunnels are valid for many installations, so this alert is opt-in.
      noTraffic:
        enabled: false
        window: 30m
    dashboard:
      enabled: true
      # Empty matches every Grafana instance visible to the operator.
      instanceSelector: {}

# Observability (docs/observability.md). ALL OFF BY DEFAULT, matching
# Cozystack's own posture (its Hubble ships disabled by default). Turn on only
# what you want; each part is independent.
observability:
  # Per-flow events with verdicts and drop reasons: the flow_events ring buffer
  # + flow_seen LRU in the datapath, the raw /flows loopback endpoint (read via
  # cozyplane-flowctl), and the cozyplane_flow_* / cozyplane_flows_total series
  # on each agent's :9411/metrics. Enabling adds ~14MiB of map memlock per node
  # (visible in cozyplane_bpf_map_memlock_bytes).
  flows: false
  # DNS metrics from the split-horizon resolver: cozyplane_dns_{queries,
  # responses}_total on the responder's :9413/metrics. Cheap (no datapath), but
  # off by default so the node exposes no extra port unless asked.
  dnsMetrics: false

agent:
  priorityClassName: system-node-critical
  resources:
    requests:
      cpu: 50m
      # The eBPF maps are charged to the agent's memory cgroup, and most of them
      # are PREALLOCATED at load: the LRU conntrack and service maps alone
      # (ct_fwd/ct_rev/svc_fwd/svc_rev at 262k entries each, np_ct at 131k) come
      # to ~100MB+ before the Go heap. Request enough that the scheduler knows.
      memory: 192Mi
    limits:
      # 256Mi was marginal and finally bit: the agent was OOM-killed at startup on
      # every node (28MB anon RSS — the cgroup was full of *map* memory, not heap).
      # A few MB of new maps was the difference. Size for the map footprint.
      memory: 512Mi

controller:
  replicas: 1
  priorityClassName: system-cluster-critical
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# The export ValidatingAdmissionPolicy that gates VPCBinding creation on the
# 'export' verb of the referenced VPC. Requires Kubernetes >= 1.30. Disable only
# if your cluster predates VAP (then VPCBinding/VPCPeering creation is governed
# by plain create RBAC alone, with no export/peer verb check). Only relevant in
# CRD mode: the aggregated apiserver enforces both verbs in its strategies.
exportPolicy:
  enabled: true

# CRDs for the LOCAL group (local.sdn.cozystack.io): underlay IPAM (FabricIP).
# This is the layer beneath everything — it must work before cert-manager,
# before etcd, and before cozyplane's own aggregated apiserver, all of which run
# as default-network pods.
#
# The tenant kinds (VPC, Port, SecurityGroup, HostFirewall, ...) are NOT CRDs.
# They are served only by chart/cozyplane-apiserver: a group served by both a
# CRD and an APIService makes the kube-apiserver's OpenAPI merge collide, and
# `kubectl apply` then fails for every object in the group (docs/api-groups.md).
#
# Disable only if you install these CRDs out-of-band.
crds:
  enabled: true
